[package]
name = "nooboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
diagnostics = ["nooboard-clipboard/diagnostics"]

[[example]]
name = "link_probe"
required-features = ["diagnostics"]

[dependencies]
nooboard-clipboard = { path = "../clipboard" }
nooboard-network = { path = "../network" }
nooboard-storage = { path = "../storage" }
nooboard-ssh = { path = "../ssh" }
uuid = { version = "1", features = ["v4"] }
tokio.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
rand = "0.10"
sha2 = "0.10"
tempfile.workspace = true

[lints]
workspace = true
