[package]
name = "nooboard-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.packager]
name = "nooboard-gui"
product-name = "nooboard"
identifier = "io.github.yorhazero.nooboard"
publisher = "YoRHazero"
homepage = "https://github.com/YoRHazero/nooboard"
license-file = "../../LICENSE"
icons = ["../../icons/nooboard-no-bkg.png"]
before-packaging-command = "cargo build -p nooboard-gui --release"
description = "Experimental local-first clipboard and transfer board for macOS and Windows."
long-description = """
nooboard is an experimental local-first clipboard and transfer board built in Rust.
The GUI package ships as a self-contained app binary with embedded UI assets.
"""

[package.metadata.packager.nsis]
installer-icon = "../../icons/nooboard-no-bkg.ico"

[dependencies]
anyhow.workspace = true
clap.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
nooboard-core = { path = "../nooboard-core" }
time.workspace = true
tokio.workspace = true

[build-dependencies]
winres = "0.1"
